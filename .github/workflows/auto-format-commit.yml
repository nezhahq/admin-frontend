name: Auto Format

on:
    pull_request_target:
        types: [opened, synchronize]

jobs:
    auto-fix:
        if: github.actor != 'weblate'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "latest"

            - name: Install dependencies
              run: bun install

            - name: Complete lockfile metadata
              run: |
                  node --input-type=module <<'EOF'
                  import { readFileSync, writeFileSync } from "node:fs";

                  const file = "package-lock.json";
                  const lock = JSON.parse(readFileSync(file, "utf8"));

                  const missing = Object.entries(lock.packages).filter(
                      ([path, pkg]) =>
                          path.startsWith("node_modules/") &&
                          !pkg.link &&
                          !pkg.inBundle &&
                          (!pkg.resolved || !pkg.integrity)
                  );

                  for (let i = 0; i < missing.length; i += 8) {
                      await Promise.all(missing.slice(i, i + 8).map(async ([path, pkg]) => {
                          const name = pkg.name ?? path.split("node_modules/").at(-1);
                          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(pkg.version)}`;
                          const response = await fetch(url, {
                              signal: AbortSignal.timeout(15000)
                          });

                          if (!response.ok) throw new Error(`Failed to fetch ${name}@${pkg.version}`);

                          const metadata = await response.json();
                          if (
                              metadata.name !== name ||
                              metadata.version !== pkg.version ||
                              !metadata.dist?.tarball ||
                              !metadata.dist?.integrity
                          ) {
                              throw new Error(`Invalid metadata for ${name}@${pkg.version}`);
                          }

                          pkg.resolved ||= metadata.dist.tarball;
                          pkg.integrity ||= metadata.dist.integrity;
                      }));
                  }

                  if (missing.some(([, pkg]) => !pkg.resolved || !pkg.integrity)) {
                      throw new Error("Lockfile metadata is incomplete");
                  }

                  if (missing.length) {
                      writeFileSync(file, JSON.stringify(lock, null, 4) + "\n");
                  }

                  console.log(`Completed metadata for ${missing.length} packages`);
                  EOF

            - name: Run formatter
              run: bun run format

            - name: Check for changes
              id: check_changes
              run: |
                  git diff --exit-code || echo "has_changes=true" >> $GITHUB_ENV

            - name: Commit and push changes
              if: steps.check_changes.outputs.has_changes == 'true' || env.has_changes == 'true'
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: "chore: auto-fix linting and formatting issues"
                  commit_options: "--no-verify"
                  file_pattern: "."

            - name: Add PR comment
              if: steps.check_changes.outputs.has_changes == 'true' || env.has_changes == 'true'
              uses: actions/github-script@v9
              with:
                  github-token: ${{secrets.GITHUB_TOKEN}}
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: 'Linting and formatting issues were automatically fixed. Please review the changes.'
                      });
