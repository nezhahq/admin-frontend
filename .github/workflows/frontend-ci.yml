name: Frontend CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

# 仓库的默认 workflow 权限是可写；这里只需要读代码，显式收紧，
# 避免构建和测试执行的依赖脚本拿到能推代码、打 tag 的 token。
permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.22.2
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Build frontend
              run: npm run build

            - name: Run unit tests
              run: npm run test
